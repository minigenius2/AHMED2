    hunt: (st) => ({
      html: stepHead(st.titleEn, st.title, "🔍") + teacher(st.say)
        + `<div class="phase"></div>`
        + `<div class="hunt-grid">${st.spots.map((sp, i) => `<button class="spot" type="button" data-i="${i}">`
          + (sp.find ? img(sp.find.photo, "found") || `<span class="found emoji-find">${esc(sp.find.emoji)}</span>` : "")
          + (img(sp.photo, "cover") || `<span class="cover emoji-find">${esc(sp.emoji)}</span>`)
          + `<span class="label"><bdi dir="ltr" lang="en">${esc(sp.en)}</bdi><small>${esc(sp.ar)}</small></span></button>`).join("")}</div>`
        + `<div class="caption" aria-live="polite"></div>`
        + `<div class="notebook"><h4>📒 <bdi dir="ltr" lang="en">Explorer's notebook</bdi> · كراسة المستكشف</h4><ul class="notes"><li class="muted">لسه مالقيناش حاجة…</li></ul></div>`
        + (st.tryAtHome ? `<div class="home-task" hidden><div class="who">🏡 جرّبها في البيت</div>${bidi(st.tryAtHome)}</div>` : ""),
      ready: false,
      narrate: () => { speak(st.say); speak(st.guess.ask); },
      mount(root) {
        const phaseEl = $(".phase", root), cap = $(".caption", root), notes = $(".notes", root);
        const total = st.spots.filter((sp) => sp.find).length;
        let guess = null, found = 0;
        const setPhase = () => {
          phaseEl.innerHTML = guess === null
            ? `1️⃣ <bdi dir="ltr" lang="en">Guess</bdi> خمّن: ${bidi(st.guess.ask)}`
            : `2️⃣ <bdi dir="ltr" lang="en">Search</bdi> دوّر · 3️⃣ <bdi dir="ltr" lang="en">Record</bdi> سجّل — لقيت ${found} من ${total}`;
        };
        setPhase();
        $$(".spot", root).forEach((btn) => btn.addEventListener("click", () => {
          const sp = st.spots[+btn.dataset.i];
          stopSpeech();
          if (guess === null) {
            guess = sp.en;
            btn.classList.add("guessed");
            setPhase();
            cap.innerHTML = `تخمينك: <bdi dir="ltr" lang="en"><b>${esc(sp.en)}</b></bdi> 🤔 ${esc(P.huntSearch)}`;
            speak(P.huntSearch);
            return;
          }
          if (btn.classList.contains("open")) { speak(sp.caption); return; }
          btn.classList.add("open");
          cap.innerHTML = bidi(sp.caption);
          speak(sp.caption);
          if (!sp.find) { btn.classList.add("empty"); tone("still"); return; }
          found++;
          tone("good");
          if (found === 1) notes.innerHTML = "";
          const line = `${sp.find.en}: ${sp.en}`;
          notes.insertAdjacentHTML("beforeend", `<li>${img(sp.find.photo, "thumb") || esc(sp.find.emoji)}<span class="term-inline"><bdi dir="ltr" lang="en">${esc(line)}</bdi><small>${esc(sp.find.ar)} · ${esc(sp.ar)}</small></span></li>`);
          speak(line, { lang: "en" });
          if (sp.en === guess && guess === st.guess.answer) {
            award(`g${run.i}`, 5);
            cap.innerHTML += ` <b>🎯 ${esc(P.guessRight)}</b>`;
            speak(P.guessRight);
          }
          setPhase();
          if (found < total) return;
          award(`h${run.i}`, 15);
          confetti();
          tone("win");
          const home = $(".home-task", root);
          if (home) home.hidden = false;
          speak(P.huntDone);
          if (st.tryAtHome) speak(st.tryAtHome);
          setReady(true);
          nearest(home || $(".notebook", root));
        }));
      },
    }),

    exam_tip: (st) => ({
      html: stepHead("Exam question", `سؤال امتحان · ${DATA.styleLabels[st.style] || ""}`, "📝")
        + `<div class="exam-card"><p class="exam-q" dir="ltr" lang="en">${esc(st.question)}</p></div>`
        + teacher(st.say)
        + `<button class="reveal">👀 فكّر في الإجابة… وبعدين اكشفها</button>`
        + `<div class="model" hidden>${englishBox(st.modelAnswer, "✍️ الإجابة النموذجية — اكتبها كده بالظبط")}</div>`,
      ready: false,
      narrate: () => { speak(st.question, { lang: "en" }); speak(st.say); },
      mount(root) {
        $(".reveal", root).addEventListener("click", (e) => {
          e.currentTarget.hidden = true;
          const model = $(".model", root);
          model.hidden = false;
          stopSpeech();
          speak(st.modelAnswer.text, { lang: "en" });
          award(`t${run.i}`, 5);
          setReady(true);
          nearest(model);
        });
      },
    }),

    summary: (st) => ({
      html: stepHead("Summary", "الخلاصة", "🌟") + teacher(st.say)
        + `<ul class="points">${st.points.map((p) => `<li><button class="chip-btn mini" data-say-en="${esc(p.en)}" aria-label="اسمعها">🔊</button><span class="term-inline"><bdi dir="ltr" lang="en">${esc(p.en)}</bdi><small>${esc(p.ar)}</small></span></li>`).join("")}</ul>`,
      ready: true,
      narrate: () => { speak(st.say); st.points.forEach((p) => speak(p.en, { lang: "en" })); },
    }),
  };

  // ---------- الشاشات ----------
  // عنوان إنجليزي جوه سطر عربي: بيتعزل عشان علامة الاستفهام ماتطيرش للناحية التانية
  const isolate = (text) => `\u2068${text}\u2069`;
  function setHeader(title, sub) {
    $("#topTitle").textContent = title;
    $("#topTitle").dir = "auto";
    $("#topSub").textContent = sub;
  }
  const setProgress = (ratio) => ($("#progressBar").style.width = `${Math.round(ratio * 100)}%`);

  function updateVoiceLine() {
    const el = $("#voiceLine");
    if (!el) return;
    const { recorded, total } = DATA.audioStats;
    if (recorded === total) { el.textContent = "🎙️ الحصة كلها متسجلة بصوت المعلم."; return; }
    const prefix = recorded ? `🎙️ ${recorded} من ${total} جملة متسجلة بصوت المعلم، والباقي مؤقتًا بصوت الموبايل. ` : "🎙️ لسه مفيش تسجيلات بصوت المعلم، فالصوت مؤقتًا صوت الموبايل. ";
    if (!hasTTS) el.textContent = prefix + "⚠️ والمتصفح ده مابيقراش بالصوت، فاللي ماتسجلش هيفضل مكتوب.";
    else if (voice.ar || !voice.count) el.textContent = prefix;
    else el.textContent = prefix + "⚠️ والجهاز ده مفيهوش صوت عربي، فالعربي اللي ماتسجلش هيفضل مكتوب.";
  }

  function renderHome() {
    run = null;
    stopSpeech();
    setProgress(0);
    renderBadges();
    setHeader(DATA.subjectLine, DATA.unitTitle);
    const done = state.done;
    const count = S.sessions.length;
    const nextSession = S.sessions.findIndex((_, i) => !done.includes(i + 1)) + 1; // 0 = كل الحصص خلصت
    const now = nextSession ? nextSession - 1 : count;
    const nodes = [...S.sessions.map((_, i) => `الحصة ${i + 1}`), "الواجب", "الاختبار الأساسي", "الدرس الجاي"];
    const journey = nodes.map((label, i) => {
      const cls = i < count && done.includes(i + 1) ? "done" : i === now ? "now" : "";
      const icon = cls === "done" ? "✓" : i === nodes.length - 1 ? "🔒" : i + 1;
      return `<div class="node ${cls}"><div class="dot">${icon}</div>${label}</div>`;
    }).join("");
    const card = (n) => {
      const sess = S.sessions[n - 1];
      const mins = Math.max(8, Math.round(sess.steps.length * 0.75));
      return `<button class="session-card" data-session="${n}"><span class="num">${n}</span><span><bdi class="t en" dir="ltr" lang="en">${esc(sess.titleEn)}</bdi><br><span class="muted">${esc(sess.title)} · ${done.includes(n) ? '<span class="done-badge">✓ خلصت</span> · ' : ""}حوالي ${mins} دقيقة</span></span></button>`;
    };
    screen.innerHTML = `
      <section class="hero">
        <div class="hero-owl" aria-hidden="true">🦉</div>
        <h1 dir="ltr" lang="en">${esc(DATA.title)}</h1>
        <p>${esc(DATA.titleAr)} — ${esc(DATA.lessonLabel)}</p>
      </section>
      <div class="journey" style="grid-template-columns: repeat(${nodes.length}, minmax(0, 1fr))" aria-label="مسار الدرس">${journey}</div>
      <div class="album" aria-label="ألبوم اللاصقات"><span class="label">ألبومي:</span>${[...S.sessions.map((_, i) => ["lesson", i + 1]), ["remediation", 1]].map(([m, n]) => `<span class="slot${state.stickers.includes(`${m}-${n}`) ? "" : " empty"}">${stickerFor(m, n)}</span>`).join("")}</div>
      <div class="cards">
        ${S.sessions.map((_, i) => card(i + 1)).join("")}
        <button class="session-card alt" data-remediation><span class="num">🔁</span><span><span class="t">شكل المراجعة لو الطفل غلط</span><br><span class="muted">شرح بطريقة تانية للجزئيات اللي غلط فيها بس — هنا مثال بجزئيتين من الدرس</span></span></button>
      </div>
      <p class="note">💡 في التطبيق الحقيقي: الحصص بتفتح واحدة ورا التانية، والواجب بعد آخر حصة، والمراجعة دي بتظهر بس لو الطفل وقع في الاختبار الأساسي مرتين ورا بعض. هنا كله مفتوح عشان تجرّب.</p>
      <p class="note" id="voiceLine"></p>
      ${Object.keys(MEDIA).length ? '<button class="link-btn" id="creditsBtn" type="button">📷 حقوق الصور</button>' : ""}`;
    updateVoiceLine();
    $("#creditsBtn")?.addEventListener("click", renderCredits);
    $$("[data-session]", screen).forEach((b) => b.addEventListener("click", () => startRun("lesson", +b.dataset.session)));
    $("[data-remediation]", screen).addEventListener("click", () => startRun("remediation"));
    const first = nextSession || 1;
    actions.innerHTML = `<button class="btn btn-primary" id="startBtn">${nextSession ? `▶️ ابدأ الحصة ${first}` : "🔁 عيد الحصة 1"}</button>`;
    $("#startBtn").addEventListener("click", () => startRun("lesson", first));
  }

  /** صفحة حقوق الصور: كل صورة ومصدرها وصاحبها ورخصتها */
  function renderCredits() {
    stopSpeech();
    setHeader("حقوق الصور", "كل الصور برخص مفتوحة، والشكر لأصحابها");
    setProgress(0);
    const license = (m) => `${m.license === "cc0" ? "CC0" : m.license === "pdm" ? "Public Domain" : `CC ${m.license.toUpperCase()}`}${m.licenseVersion && m.license !== "pdm" ? ` ${m.licenseVersion}` : ""}`;
    const link = (url, text) => (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text));
    screen.innerHTML = `<p class="note">الصور دي من <bdi dir="ltr">Openverse</bdi>، وكلها برخص بتسمح باستخدامها مع ذكر صاحبها.</p>`
      + Object.values(MEDIA).map((m) => `<div class="credit" dir="ltr">${`<img src="${esc(m.src)}" alt="">`}<div>${link(m.source, m.title || "Photo")}<br>by ${link(m.creatorUrl, m.creator)} · ${link(m.licenseUrl, license(m))}</div></div>`).join("");
    actions.innerHTML = `<button class="btn btn-primary" id="goHome">🏠 الرجوع للدرس</button>`;
    $("#goHome").addEventListener("click", renderHome);
  }

  /** لو العربي هيتقري بصوت الموبايل والجهاز مفيهوش صوت عربي، بنقول كده بوضوح مرة واحدة */
  let voiceWarningClosed = false;
  function checkArabicVoice() {
    const allRecorded = DATA.audioStats.recorded === DATA.audioStats.total;
    const missing = !allRecorded && (!hasTTS || (voice.count > 0 && !voice.ar));
    $("#voiceWarning").hidden = voiceWarningClosed || !missing;
  }

  function startRun(mode, n = 1) {
    checkArabicVoice();
    const steps = mode === "lesson" ? sessionSteps(n) : remediationSteps(DATA.demoWeak);
    run = {
      mode, n, steps, i: 0, ready: false, xp: 0, narrate: null,
      title: mode === "lesson" ? S.sessions[n - 1].titleEn : "Review",
      checks: { total: 0, first: 0 }, awarded: new Set(), attempted: new Set(), intercept: null, nextLabel: null,
      badges: steps.find((s) => s.kind === "mission")?.badges || [], earned: new Set(), predictions: {},
    };
    renderBadges();
    showStep();
  }

  function showStep() {
    stopSpeech();
    document.querySelectorAll(".badge-toast").forEach((t) => t.remove());
    const st = run.steps[run.i];
    const view = VIEWS[st.kind](st);
    screen.innerHTML = `<div class="step">${view.html}</div>`;
    window.scrollTo({ top: 0 });
    run.ready = !!view.ready;
    run.narrate = view.narrate;
    run.intercept = null;
    run.nextLabel = null;
    view.mount?.(screen.firstElementChild);
    renderStepActions();
    setHeader(DATA.title, `${run.mode === "lesson" ? `الحصة ${run.n} من ${S.sessions.length}: ${isolate(run.title)}` : "مراجعة بطريقة تانية"} · ${run.i + 1}/${run.steps.length}`);
    setProgress((run.i + 1) / run.steps.length);
    run.narrate?.();
  }

  function renderStepActions() {
    actions.innerHTML = `
      <button class="icon-btn" id="backBtn" aria-label="الخطوة اللي فاتت" ${run.i === 0 ? "disabled" : ""}>→</button>
      <button class="btn btn-ghost" id="replayBtn" aria-label="اسمع تاني">🔁 اسمع</button>
      <button class="btn btn-primary" id="nextBtn" ${run.ready ? "" : "disabled"}>${nextLabel()}</button>`;
    $("#backBtn").addEventListener("click", () => { if (run.i > 0) { run.i--; showStep(); } });
    $("#replayBtn").addEventListener("click", () => { if (!state.sound) setSound(true); stopSpeech(); run.narrate?.(); });
    $("#nextBtn").addEventListener("click", () => {
      if (!run.ready) return;
      if (run.intercept) run.intercept();
      else if (run.i === run.steps.length - 1) finishRun();
      else { run.i++; showStep(); }
    });
  }

  function finishRun() {
    stopSpeech();
    document.querySelectorAll(".badge-toast").forEach((t) => t.remove());
    const { total, first } = run.checks;
    const ratio = total ? first / total : 1;
    const stars = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : 1;
    if (run.mode === "lesson") {
      award("finish", 20);
      if (!state.done.includes(run.n)) { state.done.push(run.n); store.set("done", state.done); }
    }
    const next = run.mode === "lesson" && run.n < S.sessions.length ? run.n + 1 : null;
    const stickerKey = `${run.mode}-${run.n}`;
    const newSticker = !state.stickers.includes(stickerKey);
    if (newSticker) { state.stickers.push(stickerKey); store.set("stickers", state.stickers); }
    confetti();
    let headline, line;
    if (run.mode === "remediation") {
      headline = "المراجعة خلصت 💪";
      line = "دلوقتي الطفل بيرجع يحل الواجب تاني، والأسئلة بتركّز على الجزئيات اللي اتراجعت.";
    } else if (next) {
      headline = `عاش يا بطل! الحصة ${run.n} خلصت`;
      line = `الحصة ${next} مستنياك: <bdi dir="ltr" lang="en">${esc(S.sessions[next - 1].titleEn)}</bdi> (${esc(S.sessions[next - 1].title)})`;
    } else {
      headline = "عاش! الدرس كله خلص 🎉";
      line = "كده الواجب اتفتح 📝 ولما يعدّي الاختبار الأساسي، الدرس الجاي يفتح.";
    }
    screen.innerHTML = `
      <section class="finish">
        <div class="stars" aria-label="${stars} من 3 نجوم">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
        <h2>${esc(headline)}</h2>
        <p>${line}</p>
        <div class="gain">+${run.xp} نقطة ⭐</div>
        <div class="sticker-new" aria-hidden="true">${stickerFor(run.mode, run.n)}</div>
        <p class="muted">${newSticker ? "🎁 لاصقة جديدة اتضافت لألبومك!" : "اللاصقة دي في ألبومك من قبل كده 😉"}</p>
        ${run.badges.length ? `<div class="album">${run.badges.map((b, i) => `<span class="slot${run.earned.has(i) ? "" : " empty"}" title="${esc(b.en)}">${esc(b.emoji)}</span>`).join("")}</div>` : ""}
        ${total ? `<p class="muted">جاوب ${first} من ${total} صح من أول مرة</p>` : ""}
      </section>`;
    setHeader(DATA.title, `${isolate(run.title)} · خلصت ✅`);
    setProgress(1);
    actions.innerHTML = next
      ? `<button class="btn btn-ghost" id="goHome">🏠</button><button class="btn btn-primary" id="goNext">ابدأ الحصة ${next} ←</button>`
      : `<button class="btn btn-primary" id="goHome">🏠 الرجوع للدرس</button>`;
    $("#goHome").addEventListener("click", renderHome);
    $("#goNext")?.addEventListener("click", () => startRun("lesson", next));
    tone("win");
    speak(run.mode === "remediation" ? P.remediationDone : next ? P.sessionDone : P.lessonDone);
  }

  // ---------- اسأل المعلم ----------
  let sample = null, turns = [], askCtl = null, asking = false, pendingQuestion = null;
  const ENDPOINT = DATA.tutorEndpoint;
  const today = () => new Date().toISOString().slice(0, 10);
  const usedToday = () => store.get(`asked:${today()}`, 0);
  const left = () => Math.max(0, DAILY_LIMIT - usedToday());
  const useOne = () => { store.set(`asked:${today()}`, usedToday() + 1); updateLeft(); };
  const updateLeft = () => ($("#leftLine").textContent = left() ? `باقي لك ${left()} من ${DAILY_LIMIT} أسئلة النهارده` : "خلصت أسئلة النهارده");
  const HIDE = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"]);
  const SUGGEST = DATA.suggestions;

  function addMsg(who, text, extra = "") {
    const div = document.createElement("div");
    div.className = `msg ${who === "child" ? "child-msg" : "teacher-msg"} ${extra}`;
    div.innerHTML = bidi(text);
    $("#chat").appendChild(div);
    div.scrollIntoView({ block: "end", behavior: reduceMotion ? "auto" : "smooth" });
    return div;
  }
  function setMsg(div, text) {
    div.classList.remove("thinking");
    div.innerHTML = bidi(text);
    const chat = $("#chat");
    chat.scrollTop = chat.scrollHeight;
  }
  function whereNow() {
    if (!run) return "The child is on the lesson's home screen.";
    const st = run.steps[run.i];
    const at = st.title || st.ask || st.question || st.say || "";
    return `Where the child is right now: ${run.mode === "lesson" ? `session ${run.n} of ${S.sessions.length} ("${run.title}")` : "a remediation review"}, at this part: "${at.slice(0, 160)}".`;
  }
  function openSheet() {
    stopSpeech();
    $("#sheet").hidden = false;
    if (!$("#chat").children.length) {
      addMsg("teacher", "اسألني أي حاجة في الدرس ده وأنا أشرحهالك 😊");
      const box = document.createElement("div");
      box.className = "suggest";
      box.innerHTML = SUGGEST.map((s) => `<button class="chip-btn" type="button">${bidi(s)}</button>`).join("");
      $$("button", box).forEach((b, i) => b.addEventListener("click", () => ask(SUGGEST[i])));
      $("#chat").appendChild(box);
    }
    updateLeft();
    $("#sheetClose").focus();
  }
  function closeSheet() {
    askCtl?.abort();
    $("#sheet").hidden = true;
    $("#askBtn").focus();
  }
  function setAsking(on) {
    asking = on;
    $("#askSend").disabled = on;
    $("#askSend").textContent = on ? "…" : "اسأل";
  }

  /** جوه Claude: السؤال بيروح لـ Claude من حساب اللي فاتح الصفحة، والرد بيظهر وهو بيتكتب */
  async function askClaude(q, bubble) {
    const instructions = `${T.rules}\n\n${T.context}\n\n${whereNow()}\n\nNow answer the child's next message as ${TEACHER}, in plain text only.`;
    const { text } = await sample([{ role: "user", content: instructions }, ...turns.slice(-8), { role: "user", content: q }], {
      cache: false,
      modelTier: "quick",
      signal: askCtl.signal,
      onText: ({ text }) => setMsg(bubble, text),
    });
    return text;
  }

  /** على الموقع: السؤال بيروح للسيرفر بتاعنا، وهو اللي بيسأل Claude بمفتاح الـ API */
  async function askServer(q) {
    const history = [];
    for (let i = 0; i + 1 < turns.length; i += 2) history.push({ question: turns[i].content, answer: turns[i + 1].content });
    let res;
    try {
      res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ lessonId: DATA.lessonId, question: q, history: history.slice(-4), where: whereNow(), code: store.get("pilotCode", "") }),
        signal: askCtl.signal,
      });
    } catch (e) {
      throw { code: e && e.name === "AbortError" ? "cancelled" : "upstream_error" };
    }
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) throw { code: "pilot_code" };
    if (!res.ok || !data.answer) throw { code: "upstream_error" };
    return data.answer;
  }

  async function ask(raw) {
    if (asking) return;
    const q = raw.trim().slice(0, 300);
    if (pendingQuestion !== null) {
      // الرسالة دي هي كود التجربة، وبعده بنبعت السؤال اللي كان مستني
      if (!q) return;
      store.set("pilotCode", q);
      $("#askInput").value = "";
      addMsg("child", "🔑 ••••");
      const waiting = pendingQuestion;
      pendingQuestion = null;
      return answer(waiting);
    }
    if (!q) { addMsg("teacher", T.messages.empty); return; }
    if (left() <= 0) { addMsg("teacher", T.messages.limitReached); return; }
    $("#askInput").value = "";
    $(".suggest")?.remove();
    addMsg("child", q);
    return answer(q);
  }

  async function answer(q) {
    const bubble = addMsg("teacher", `${TEACHER} بيفكر… 🤔`, "thinking");
    askCtl = new AbortController();
    setAsking(true);
    try {
      const text = sample ? await askClaude(q, bubble) : await askServer(q);
      setMsg(bubble, text);
      turns.push({ role: "user", content: q }, { role: "assistant", content: text });
      useOne();
      const say = document.createElement("button");
      say.className = "chip-btn say-btn";
      say.type = "button";
      say.textContent = "🔊 اسمع الرد";
      say.addEventListener("click", () => { if (!state.sound) setSound(true); stopSpeech(); speak(text); });
      bubble.appendChild(say);
      speak(text);
    } catch (e) {
      const code = e && e.code;
      if (code === "pilot_code") {
        setMsg(bubble, "محتاج كود التجربة الأول 🔑 اكتبه في المربع اللي تحت وابعته، وأنا هجاوبك على طول.");
        pendingQuestion = q;
        store.set("pilotCode", "");
      } else if (code === "cancelled") setMsg(bubble, e.text || "…");
      else if (HIDE.has(code)) {
        setMsg(bubble, "المعلم مش متاح في النسخة دي دلوقتي 🙏");
        $("#askBtn").hidden = true;
        $("#askForm").hidden = true;
      } else if (code === "refused" || code === "empty_completion") { setMsg(bubble, T.messages.refused); useOne(); }
      else setMsg(bubble, (e && e.text ? e.text + "\n\n" : "") + T.messages.busy);
    } finally {
      setAsking(false);
    }
  }

  // جوه Claude بنستخدم Claude نفسه، وعلى الموقع بنستخدم السيرفر
  if (ENDPOINT) $("#askBtn").hidden = false;
  (async () => {
    try { if (window.claude?.use) sample = await window.claude.use("sample"); } catch { sample = null; }
    if (sample) $("#askBtn").hidden = false;
  })();

  $("#askBtn").addEventListener("click", openSheet);
  $("#sheetClose").addEventListener("click", closeSheet);
  $("#sheetBackdrop").addEventListener("click", closeSheet);
  $("#askForm").addEventListener("submit", (e) => { e.preventDefault(); ask($("#askInput").value); });
  $("#askInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(e.currentTarget.value); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

  // ---------- عام ----------
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-say-en]");
    if (!b) return;
    if (!state.sound) setSound(true);
    stopSpeech();
    speak(b.dataset.sayEn, { lang: "en" });
    b.classList.remove("pulse");
    void b.offsetWidth;
    b.classList.add("pulse");
  });
  $("#homeBtn").addEventListener("click", renderHome);
  $("#voiceWarningClose").addEventListener("click", () => { voiceWarningClosed = true; $("#voiceWarning").hidden = true; });
  $("#soundBtn").addEventListener("click", () => setSound(!state.sound));

  setSound(state.sound);
  updateXP(0);
  renderHome();
})();
</script>
